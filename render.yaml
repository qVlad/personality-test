# Render Blueprint for Personality Test Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: personality-test-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/personality-test.db
      - key: FRONTEND_URL
        sync: false  # Set manually after deploying frontend
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
